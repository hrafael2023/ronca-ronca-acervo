name: Atualizar acervo

# Lê a planilha DataRonca, regenera data/acervo.json e busca capas novas.
# Se algo mudou, faz commit — e o GitHub Pages publica sozinho.
on:
  schedule:
    - cron: "17 */3 * * *"   # a cada 3 horas
  workflow_dispatch: {}       # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: escreve-no-repo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler planilha e buscar capas
        run: python3 scripts/atualizar.py --limite 1500
      - name: Commit se mudou
        run: |
          if git diff --quiet -- data; then
            echo "Nada novo na planilha."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Atualiza acervo a partir da planilha ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git pull --rebase origin main
          git push
